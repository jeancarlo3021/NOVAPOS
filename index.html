<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0F766E" />

    <link rel="icon" href="/favicon.ico?v=2" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=2" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />

    <title>ColónClick — Punto de Venta y Facturación Electrónica en Costa Rica</title>
    <meta name="description" content="Sistema de punto de venta y facturación electrónica para comercios de Costa Rica. Facturá a Hacienda, controlá tu inventario y mirá tus números desde el celular." />
    <meta name="keywords" content="POS Costa Rica, Facturación Electrónica, Punto de Venta, ColónClick, Sistema para comercios, Hacienda CR" />
    <meta name="author" content="ColónClick" />
    <link rel="canonical" href="https://colonclick.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://colonclick.com/" />
    <meta property="og:title" content="ColónClick — Punto de Venta y Facturación Electrónica" />
    <meta property="og:description" content="Facturá a Hacienda, controlá tu inventario y mirá tus números desde el celular. Hecho en Costa Rica." />
    <meta property="og:image" content="https://colonclick.com/og-image.jpg" />
    <meta name="twitter:card" content="summary_large_image" />

    <!--
      ESTA PÁGINA NO CARGA LA APLICACIÓN.

      Tiene su propio punto de entrada, chiquito, y ese es el punto: el bundle
      del ERP pesa 29 MB repartidos en trozos, y hacer que alguien que solo
      quiere saber qué es esto empiece descargando el armazón de un sistema de
      punto de venta es perder justo a quien se quería convencer.

      La aplicación vive en app.html y se sirve en /app y en el resto de las
      rutas (ver vercel.json).
    -->
    <!-- La fuente de los titulares. `preconnect` adelanta la conexión y
         `display=swap` hace que el texto se vea al instante con la del
         sistema mientras llega; si nunca llega, la página se lee igual. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" />
    <noscript><link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" /></noscript>

    <style>
      /* Lo mínimo para que no haya un parpadeo en blanco antes de pintar. */
      html, body { margin: 0; padding: 0; background: #FBFAF8; }
      #landing { min-height: 100vh; }
      .precarga {
        min-height: 100vh; display: grid; place-items: center;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; color: #0F766E;
      }
    </style>
  </head>
  <body>
    <div id="landing">
      <!-- Contenido de respaldo: si el JavaScript falla o tarda, acá hay algo
           que leer y una forma de entrar. Una página de presentación en blanco
           es un cliente que no vuelve. -->
      <div class="precarga">
        <div style="text-align:center; padding:24px">
          <h1 style="font-size:28px; margin:0 0 8px">ColónClick</h1>
          <p style="color:#5B6B66; margin:0 0 20px; max-width:34ch; line-height:1.5">
            Punto de venta y facturación electrónica para comercios de Costa Rica.
          </p>
          <a href="/login" style="display:inline-block; background:#0F766E; color:#fff;
             text-decoration:none; font-weight:700; padding:12px 22px; border-radius:12px">
            Entrar al sistema
          </a>
        </div>
      </div>
    </div>
    <script type="module" src="/src/landing/main.tsx"></script>
  </body>
</html>
